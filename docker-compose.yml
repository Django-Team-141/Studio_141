services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    image: studio141-app
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py createcachetable
      && python manage.py collectstatic --noinput
      && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

  cleaner:
    image: studio141-app
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      - web
    command: >
      sh -c "sleep 120;
      while true; do
      python manage.py clearsessions;
      python manage.py purge_orders --days 365;
      sleep 86400;
      done"

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    env_file: .env.prod
    entrypoint: []
    depends_on:
      db:
        condition: service_healthy
    # tr جلوی خراب شدن اسکریپت را می‌گیرد اگر روی ویندوز با پایان‌خط CRLF ذخیره شده باشد
    command: sh -c "tr -d '\r' < /scripts/backup.sh | sh"
    volumes:
      - backups_data:/backups
      - media_data:/media:ro
      - ./scripts:/scripts:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - web
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  static_data:
  media_data:
  backups_data:
  caddy_data:
  caddy_config: