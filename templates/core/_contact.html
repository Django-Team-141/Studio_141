<div class="contact" role="group" aria-label="{{ t.contact_label }}">
  {% for c in contact %}
    {% if c.live %}
    <a class="cbtn cbtn-{{ c.key }}" href="{{ c.url }}"{% if c.key != "email" %} target="_blank" rel="noopener noreferrer"{% endif %} aria-label="{{ c.label }}" title="{{ c.label }}">
      {% include "core/_icon.html" with key=c.key %}
    </a>
    {% else %}
    <a class="cbtn cbtn-{{ c.key }} is-soon" href="{% url 'home' %}#contact" data-soon="{{ c.msg }}" aria-label="{{ c.label }} · {{ t.soon_badge }}" title="{{ c.label }} · {{ t.soon_badge }}">
      {% include "core/_icon.html" with key=c.key %}
    </a>
    {% endif %}
  {% endfor %}
</div>
